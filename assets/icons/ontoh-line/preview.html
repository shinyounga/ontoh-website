<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ONTOH Line Icons</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#F5F6F8;color:#212121;font-family:Pretendard,system-ui,sans-serif}
    main{max-width:1120px;margin:auto;padding:64px 32px}h1{margin:0;color:#0A2440;font-size:34px}p{color:#555}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-top:36px}
    figure{margin:0;background:#fff;border:1px solid #E5E7EB;padding:26px}img{display:block;width:128px;height:128px;margin:0 auto 22px}
    figcaption{border-top:1px solid #E5E7EB;padding-top:16px;color:#0A2440;font-size:15px;font-weight:700}
  </style>
</head>
<body><main>
  <h1>ONTOH Line Icons</h1>
  <p>제품 기능 설명 및 홍보자료용 SVG 아이콘 초안</p>
  <div class="grid">
    <figure><img src="realtime-monitoring.svg" alt=""><figcaption>실시간 AI 현장 관제</figcaption></figure>
    <figure><img src="hazard-detection.svg" alt=""><figcaption>위험 상황 자동 감지</figcaption></figure>
    <figure><img src="ptz-tracking.svg" alt=""><figcaption>PTZ 카메라 자율 추적</figcaption></figure>
    <figure><img src="regulation-matching.svg" alt=""><figcaption>안전 규정 자동 매칭</figcaption></figure>
    <figure><img src="report-automation.svg" alt=""><figcaption>점검 및 보고서 자동 생성</figcaption></figure>
    <figure><img src="worker-health.svg" alt=""><figcaption>근로자 건강 정보 관리</figcaption></figure>
    <figure><img src="work-fitness.svg" alt=""><figcaption>작업 적합성 판정</figcaption></figure>
    <figure><img src="followup-care.svg" alt=""><figcaption>건강 이상 사후관리</figcaption></figure>
  </div>
</main></body>
</html>
